# Ritsu CI. Same entry points as local development: see Makefile and
# docs/process/testing.md. Keep jobs thin; logic belongs in `make` targets.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (fmt, clippy, tests, crate graph)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # fuzz/ and bench/ are stand-alone packages with their own target directories.
          workspaces: |
            .
            fuzz
            bench
      # lint-aux/test-aux: fmt + clippy + tests of fuzz/ (replays fuzz/regressions and the seed
      # corpus on stable, WP-QA-08) and bench/ (workload unit tests); bench-check: pipeline smoke test.
      - run: make fmt-check lint lint-aux test-rust test-aux bench-check graph

  cpp:
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-asan]
        include:
          - compiler: gcc
            name: gcc
            cc: gcc
            cxx: g++
            build_dir: build/air2spirv
            cmake_args: ""
          - compiler: clang
            name: clang
            cc: clang
            cxx: clang++
            build_dir: build/air2spirv-clang
            cmake_args: ""
          # ASan + UBSan (AIR2SPIRV_SANITIZE, ADR-0003); the 60 s libFuzzer smoke of
          # fuzz_air_sniff runs in fuzz.yml.
          - compiler: clang-asan
            name: clang (ASan+UBSan)
            cc: clang
            cxx: clang++
            build_dir: build/air2spirv-asan
            cmake_args: -DAIR2SPIRV_SANITIZE=ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      # spirv-tools/spirv-headers come from noble-updates (>= 2025.1 for SPV_ENV_VULKAN_1_4);
      # Ubuntu's spirv-tools package already ships headers, static libs and CMake configs.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang clang-format spirv-tools spirv-headers libclang-rt-18-dev
      - run: make cpp CPP_BUILD_DIR=${{ matrix.build_dir }} CPP_CMAKE_ARGS=${{ matrix.cmake_args }}
      - name: clang-format check
        if: matrix.compiler == 'gcc' # formatting does not depend on the compiler
        run: make cpp-fmt-check

  docs:
    name: docs (markdown links)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: make links status

  # Future source of reference results for the DBT differential tests
  # (docs/process/testing.md, "Differenztests"): real arm64 hardware executes
  # statically linked aarch64 test programs and records register/memory state.
  # For now it only runs the ritsu-dbt unit tests on an arm64 host, which also
  # proves the crate is portable (no x86-only assumptions in T0).
  # continue-on-error: the arm64 hosted runners and the reference-recording
  # pipeline are not established yet; a failure here must not block merges
  # until this job is promoted to required (remove the flag then).
  dbt-reference:
    name: dbt-reference (arm64, placeholder)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uname -m
      - run: cargo test -p ritsu-dbt
